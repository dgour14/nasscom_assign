<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <!-- Modern Typography: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div data-previous-operand class="previous-operand"></div>
            <div data-current-operand class="current-operand">0</div>
        </div>
        <div class="keypad">
            <button data-all-clear class="btn btn-special span-two">AC</button>
            <button data-delete class="btn btn-special">DEL</button>
            <button data-operation="/" class="btn btn-operator">÷</button>

            <button data-number="7" class="btn">7</button>
            <button data-number="8" class="btn">8</button>
            <button data-number="9" class="btn">9</button>
            <button data-operation="*" class="btn btn-operator">×</button>

            <button data-number="4" class="btn">4</button>
            <button data-number="5" class="btn">5</button>
            <button data-number="6" class="btn">6</button>
            <button data-operation="-" class="btn btn-operator">−</button>

            <button data-number="1" class="btn">1</button>
            <button data-number="2" class="btn">2</button>
            <button data-number="3" class="btn">3</button>
            <button data-operation="+" class="btn btn-operator">+</button>

            <button data-number="." class="btn">.</button>
            <button data-number="0" class="btn">0</button>
            <button data-equals class="btn btn-equals span-two">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
